name: Sync PRF ADM content from Notion

on:
  push:
    branches:
      - main
    paths:
      - "data.js"
      - "scripts/sync-notion.mjs"
      - "scripts/build-central-status.mjs"
      - ".github/workflows/sync-notion.yml"
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.PRF_ADM_GITHUB || secrets.NOTION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Skip until the Notion secret is configured
        if: ${{ env.NOTION_TOKEN == '' }}
        run: echo "Configure PRF_ADM_GITHUB in repository Actions secrets to enable the Notion sync."
      - name: Read Notion materials and questions
        if: ${{ env.NOTION_TOKEN != '' }}
        run: node scripts/sync-notion.mjs
      - name: Build sanitized Central status
        if: ${{ env.NOTION_TOKEN != '' }}
        run: node scripts/build-central-status.mjs

      - name: Publish the refreshed snapshot to the repository
        if: ${{ env.NOTION_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/prf-notion.json central-status.json
          if git diff --cached --quiet; then
            echo "Notion content is unchanged."
          else
            git commit -m "Sync PRF ADM content from Notion"
            git pull --rebase origin main
            git push
          fi
